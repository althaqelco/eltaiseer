# Netlify مع Next.js SSR — الإضافة الرسمية تكتشف الإعدادات تلقائياً
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ملفات Next الثابتة مبصومة بالمحتوى — كاش سنة آمن
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
